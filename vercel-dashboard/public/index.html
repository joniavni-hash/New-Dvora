<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דבורה 🧭 — לוח בקרה</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #8b8d97;
    --red: #ef4444;
    --yellow: #eab308;
    --green: #22c55e;
    --blue: #3b82f6;
    --purple: #a855f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    line-height: 1.5;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .header .dot.stale {
    background: var(--yellow);
  }
  .header .dot.offline {
    background: var(--red);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h2 {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .icon { font-size: 16px; }

  /* Tasks */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .task:last-child { border-bottom: none; }
  .task .priority {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .task .priority.red { background: var(--red); }
  .task .priority.yellow { background: var(--yellow); }
  .task .priority.green { background: var(--green); }
  .task .name { font-size: 14px; font-weight: 500; }
  .task .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task .age { font-size: 11px; color: var(--muted); margin-right: auto; }

  /* Integrations */
  .integration {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .integration:last-child { border-bottom: none; }
  .integration .name { font-size: 14px; }
  .integration .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }
  .badge.ok { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.warn { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .badge.err { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge.off { background: rgba(139,141,151,0.15); color: var(--muted); }

  /* Stats */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .stat {
    text-align: center;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
  }
  .stat .value {
    font-size: 28px;
    font-weight: 700;
    color: var(--blue);
  }
  .stat .label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Cron */
  .cron-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .cron-item:last-child { border-bottom: none; }
  .cron-item .next { color: var(--muted); font-size: 12px; }

  /* Groups */
  .group {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .group:last-child { border-bottom: none; }
  .group .name { font-size: 14px; font-weight: 500; }
  .group .behavior { font-size: 12px; color: var(--muted); }

  /* Cost bar */
  .cost-bar {
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .cost-bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s;
  }

  .updated {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
  }

  .card.full { grid-column: 1 / -1; }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 16px;
  }

  /* Outlook badge */
  .outlook-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(239,68,68,0.15);
    color: var(--red);
    font-weight: 500;
    margin-right: 8px;
  }

  @media (max-width: 400px) {
    body { padding: 12px; }
    .header h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr; }
    .stat .value { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧭 דבורה — לוח בקרה</h1>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="gateway-status">מתחבר...</span>
    <span>•</span>
    <span id="timestamp"></span>
  </div>
</div>

<div id="content">
  <div class="loading">ממתין לנתונים...</div>
</div>

<div class="updated" id="footer"></div>

<script>
const DAY_BUDGET = 60;
const fmt = new Intl.DateTimeFormat('he-IL', {
  timeZone: 'Asia/Jerusalem',
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
  hour: '2-digit', minute: '2-digit'
});
const timeFmt = new Intl.DateTimeFormat('he-IL', {
  timeZone: 'Asia/Jerusalem',
  hour: '2-digit', minute: '2-digit'
});

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTasks(tasks) {
  if (!tasks || !tasks.length) return '<div style="color:var(--muted);font-size:13px;">אין משימות פתוחות</div>';
  return tasks.map(t => `
    <div class="task">
      <div class="priority ${esc(t.priority)}"></div>
      <div>
        <div class="name">${esc(t.name)}</div>
        <div class="meta">${esc(t.status)}${t.next ? ' · ' + esc(t.next) : ''}</div>
        <div class="age">${t.opened ? '📅 ' + esc(t.opened) : ''}</div>
      </div>
    </div>
  `).join('');
}

function renderIntegrations(integrations, outlookUnread) {
  if (!integrations || !integrations.length) return '<div style="color:var(--muted);font-size:13px;">אין נתונים</div>';
  return integrations.map(i => {
    let extra = '';
    if (i.name.toLowerCase().includes('outlook') && outlookUnread != null && outlookUnread > 0) {
      extra = `<span class="outlook-badge">📬 ${outlookUnread}</span>`;
    }
    return `
    <div class="integration">
      <span class="name">${esc(i.name)}${extra}</span>
      <span class="badge ${esc(i.badge_class)}">${esc(i.badge_text)}</span>
    </div>`;
  }).join('');
}

function renderMetrics(metrics, cost) {
  const m = metrics || {};
  const c = cost || {};
  const costPct = Math.min(100, Math.round(((c.today || 0) / DAY_BUDGET) * 100));
  const costColor = costPct > 80 ? 'var(--red)' : costPct > 50 ? 'var(--yellow)' : 'var(--blue)';
  const barGrad = costPct > 80
    ? 'linear-gradient(90deg, var(--yellow), var(--red))'
    : 'linear-gradient(90deg, var(--green), var(--yellow))';

  return `
    <h2><span class="icon">📊</span> ביצועים (30 יום)</h2>
    <div class="stat-grid">
      <div class="stat">
        <div class="value">${(m.total_responses || 0).toLocaleString()}</div>
        <div class="label">תגובות</div>
      </div>
      <div class="stat">
        <div class="value">${(m.total_sessions || 0).toLocaleString()}</div>
        <div class="label">sessions</div>
      </div>
      <div class="stat">
        <div class="value">${m.avg_latency || 0}s</div>
        <div class="label">median latency</div>
      </div>
      <div class="stat">
        <div class="value">${m.avg_tool_calls || 0}</div>
        <div class="label">tool calls/turn</div>
      </div>
    </div>

    <h2 style="margin-top:20px"><span class="icon">💰</span> עלות</h2>
    <div class="stat-grid">
      <div class="stat">
        <div class="value" style="color:${costColor}">$${c.today || 0}</div>
        <div class="label">היום</div>
      </div>
      <div class="stat">
        <div class="value" style="color:var(--yellow)">$${c.this_week || 0}</div>
        <div class="label">השבוע</div>
      </div>
      <div class="stat">
        <div class="value">$${c.last_30d || 0}</div>
        <div class="label">30 יום</div>
      </div>
      <div class="stat">
        <div class="value">~$${c.daily_avg || 0}</div>
        <div class="label">ממוצע יומי</div>
      </div>
    </div>
    <div class="cost-bar">
      <div class="fill" style="width:${costPct}%;background:${barGrad};"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;">
      <span>$0</span><span>תקרה $${DAY_BUDGET}/יום</span>
    </div>
  `;
}

function renderCronJobs(jobs) {
  if (jobs === null || jobs === undefined) return '<div style="color:var(--muted);font-size:13px;">לא זמין</div>';
  if (!jobs.length) return '<div style="color:var(--muted);font-size:13px;">אין cron jobs</div>';
  return jobs.map(j => {
    const icon = j.enabled ? (j.last_status === 'error' ? '❌' : '✅') : '⏸️';
    return `
    <div class="cron-item">
      <span>${icon} ${esc(j.name)}</span>
      <span class="next">${esc(j.next_run || j.schedule)}</span>
    </div>`;
  }).join('');
}

function renderGroups(groups) {
  if (!groups || !groups.length) return '<div style="color:var(--muted);font-size:13px;">אין קבוצות</div>';
  return groups.map(g => `
    <div class="group">
      <div class="name">${esc(g.name)}</div>
      <div class="behavior">${esc(g.behavior)}</div>
    </div>
  `).join('');
}

function renderHeartbeat(items) {
  if (!items || !items.length) return '<div style="color:var(--muted);font-size:13px;">אין נתונים</div>';
  return items.map(h => `
    <div class="cron-item">
      <span>${esc(h.name)}</span>
      <span class="next">${esc(h.schedule)}</span>
    </div>
  `).join('');
}

function render(data) {
  if (!data || data.error === 'no_data') {
    document.getElementById('content').innerHTML = '<div class="loading">ממתין לנתונים...</div>';
    return;
  }

  // Update header status
  const dot = document.getElementById('status-dot');
  const statusText = document.getElementById('gateway-status');
  if (data.updated_at) {
    const updatedAt = new Date(data.updated_at);
    const ageMin = (Date.now() - updatedAt.getTime()) / 60000;
    if (ageMin < 5) {
      dot.className = 'dot';
      statusText.textContent = 'פעיל';
    } else if (ageMin < 15) {
      dot.className = 'dot stale';
      statusText.textContent = 'עודכן לפני ' + Math.round(ageMin) + ' דק׳';
    } else {
      dot.className = 'dot offline';
      statusText.textContent = 'לא עודכן';
    }
  }

  document.getElementById('content').innerHTML = `
    <div class="grid">
      <div class="card">
        <h2><span class="icon">📌</span> משימות פתוחות</h2>
        <div>${renderTasks(data.tasks)}</div>
      </div>

      <div class="card">
        <h2><span class="icon">🔌</span> אינטגרציות</h2>
        <div>${renderIntegrations(data.integrations, data.outlook_unread)}</div>
      </div>

      <div class="card">
        ${renderMetrics(data.metrics, data.cost)}
      </div>

      <div class="card">
        <h2><span class="icon">⏰</span> Cron Jobs</h2>
        <div>${renderCronJobs(data.cron_jobs)}</div>
      </div>

      <div class="card">
        <h2><span class="icon">💬</span> קבוצות</h2>
        <div>${renderGroups(data.groups)}</div>
      </div>

      <div class="card">
        <h2><span class="icon">💓</span> Heartbeat Schedule</h2>
        <div>${renderHeartbeat(data.heartbeat)}</div>
      </div>
    </div>
  `;

  // Update footer
  const now = new Date();
  document.getElementById('footer').textContent = 'עודכן: ' + fmt.format(now);
}

async function fetchData() {
  try {
    const resp = await fetch('/api/data');
    const data = await resp.json();
    render(data);
  } catch (err) {
    console.error('Fetch error:', err);
  }
}

// Initial load
document.getElementById('timestamp').textContent = fmt.format(new Date());
fetchData();

// Refresh every 60 seconds
setInterval(() => {
  fetchData();
  document.getElementById('timestamp').textContent = fmt.format(new Date());
}, 60000);
</script>
</body>
</html>
